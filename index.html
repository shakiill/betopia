<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betopia Group | Frame Maker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #f26522; --secondary: #333; --bg: #f8f9fa; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-card { background: #fff; padding: 2rem; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 900px; display: flex; gap: 2rem; flex-wrap: wrap; }
        .preview-side { flex: 1; min-width: 320px; position: relative; }
        .editor-side { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 1.5rem; }
        
        canvas { width: 100%; border-radius: 8px; border: 1px solid #eee; background-image: linear-gradient(45deg, #f0f0f0 25%, transparent 25%), linear-gradient(-45deg, #f0f0f0 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #f0f0f0 75%), linear-gradient(-45deg, transparent 75%, #f0f0f0 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px; }
        
        .input-group { display: flex; flex-direction: column; gap: 0.5rem; }
        label { font-size: 0.85rem; font-weight: 600; color: #666; text-transform: uppercase; }
        input { padding: 12px; border: 2px solid #eee; border-radius: 8px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); }
        
        .btn { padding: 14px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; text-align: left; text-decoration: none; }
        .btn-upload { background: #eee; color: var(--secondary); }
        .btn-download { background: var(--primary); color: white; margin-top: auto; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        
        .instruction { font-size: 0.8rem; color: #888; margin-top: -1rem; }
        @media (max-width: 768px) { .app-card { margin: 1rem; padding: 1rem; } }
    </style>
</head>
<body>

<div class="app-card">
    <div class="preview-side">
        <canvas id="mainCanvas" width="1080" height="1080"></canvas>
    </div>

    <div class="editor-side">
        <div style="margin-bottom: 1rem;">
            <h1 style="margin:0; font-size: 1.5rem; color: var(--secondary);">Frame Editor</h1>
            <p style="color: #666; font-size: 0.9rem;">Customize your New Year 2026 card.</p>
        </div>

        <div class="input-group">
            <label>1. Select Photo</label>
            <input type="file" id="upload" accept="image/*">
            <p class="instruction">Drag photo on canvas to reposition</p>
        </div>

        <div class="input-group">
            <label>2. Full Name</label>
            <input type="text" id="name" placeholder="Ex: John Doe">
        </div>

        <div class="input-group">
            <label>3. Designation</label>
            <input type="text" id="role" placeholder="Ex: Project Manager">
        </div>

        <div class="input-group">
            <label>4. Photo Scale</label>
            <input type="range" id="scale" min="0.1" max="2" step="0.01" value="1">
        </div>

        <div style="display: flex; gap: 10px;">
            <button class="btn btn-upload" id="reset" style="flex:1;">Reset</button>
            <button class="btn btn-download" id="download" style="flex:2;">Download PNG</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const upload = document.getElementById('upload');
    const nameInput = document.getElementById('name');
    const roleInput = document.getElementById('role');
    const scaleInput = document.getElementById('scale');
    const downloadBtn = document.getElementById('download');
    const resetBtn = document.getElementById('reset');

    let frameImg = new Image();
    // frameImg.crossOrigin = "anonymous"; // Removed for local file compatibility
    frameImg.src = '57.png'; 

    let userImg = null;
    const defaultX = 791, defaultY = 228;
    let userX = defaultX, userY = defaultY; 
    let isDragging = false;
    let lastX, lastY;

    // Requirement 2.2: Product Functions - Draw logic
    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. User Image (Bottom Layer) with Clipping
        if (userImg) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(700, 428, 451, 0, Math.PI * 2); // Circular clip for Requirement 3.5
            ctx.clip();
            
            const sw = userImg.width * scaleInput.value;
            const sh = userImg.height * scaleInput.value;
            ctx.drawImage(userImg, userX - sw/2, userY - sh/2, sw, sh);
            ctx.restore();
        }

        // 2. Template (Middle Layer) - Requirement 3.3
        ctx.drawImage(frameImg, 0, 0, 1080, 1080);

        // 3. Text (Top Layer) - Requirement 3.4
        ctx.fillStyle = "#333333";
        ctx.textAlign = "left";
        
        ctx.font = "bold 32px 'Inter', sans-serif";
        ctx.fillText(nameInput.value.toUpperCase(), 45, 635);
        
        ctx.font = "500 22px 'Inter', sans-serif";
        ctx.fillStyle = "#666";
        ctx.fillText(roleInput.value, 45, 665);
    }

    // Event Listeners
    frameImg.onload = render;
    [nameInput, roleInput, scaleInput].forEach(el => el.addEventListener('input', render));

    upload.addEventListener('change', (e) => {
        const reader = new FileReader();
        reader.onload = (f) => {
            userImg = new Image();
            userImg.onload = () => {
                userX = defaultX;
                userY = defaultY;
                scaleInput.value = 1;
                render();
            };
            userImg.src = f.target.result;
        };
        if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
    });

    // Requirement 3.5: Image Placement (Drag and Drop)
    canvas.onmousedown = (e) => {
        isDragging = true;
        const rect = canvas.getBoundingClientRect();
        lastX = (e.clientX - rect.left) * (1080 / rect.width);
        lastY = (e.clientY - rect.top) * (1080 / rect.height);
    };

    window.onmouseup = () => isDragging = false;

    canvas.onmousemove = (e) => {
        if (!isDragging || !userImg) return;
        const rect = canvas.getBoundingClientRect();
        const mouseX = (e.clientX - rect.left) * (1080 / rect.width);
        const mouseY = (e.clientY - rect.top) * (1080 / rect.height);
        
        userX += (mouseX - lastX);
        userY += (mouseY - lastY);
        lastX = mouseX;
        lastY = mouseY;
        render();
    };

    resetBtn.onclick = () => {
        nameInput.value = "";
        roleInput.value = "";
        scaleInput.value = 1;
        upload.value = "";
        userImg = null;
        userX = defaultX;
        userY = defaultY;
        render();
    };

    downloadBtn.onclick = () => {
        try {
            const link = document.createElement('a');
            link.download = 'Betopia_NewYear_Card.png';
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        } catch (err) {
            alert("Download failed due to browser security restrictions on local files. Please run this on a local server (e.g., using VS Code Live Server) to enable downloads.");
            console.error(err);
        }
    };
</script>

</body>
</html>
